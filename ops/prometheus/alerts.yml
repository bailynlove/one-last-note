groups:
  - name: one-last-note
    rules:
      - alert: ApiDown
        expr: up{job="one-last-note-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: API is not scrapeable
      - alert: Api5xxWarning
        expr: sum(rate(api_requests_total{status=~"5.."}[15m])) / clamp_min(sum(rate(api_requests_total[15m])), 0.001) > 0.02
        for: 15m
        labels: { severity: warning }
        annotations: { summary: API 5xx ratio above 2% }
      - alert: Api5xxCritical
        expr: sum(rate(api_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(api_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: page }
        annotations: { summary: API 5xx ratio above 5% for 5 minutes }
      - alert: ApiLatencyWarning
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_duration_seconds_bucket[30m]))) > 0.75
        for: 30m
        labels: { severity: warning }
        annotations: { summary: API p95 above 750ms }
      - alert: ApiLatencyCritical
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_duration_seconds_bucket[15m]))) > 2
        for: 15m
        labels: { severity: page }
        annotations: { summary: API p95 above 2s for 15 minutes }
      - alert: QueueOldestJob
        expr: max by (queue) (queue_oldest_waiting_seconds) > 900
        for: 1m
        labels: { severity: page }
        annotations: { summary: Oldest queued job is older than 15 minutes }
      - alert: DatabaseConnections
        expr: db_pool_connections{state="total"} / clamp_min(db_pool_max, 1) > 0.9
        for: 10m
        labels: { severity: page }
        annotations: { summary: Database pool connections above 90% for 10 minutes }
      - alert: QueueFailures
        expr: sum by (queue) (rate(worker_jobs_total{status="failed"}[30m])) / clamp_min(sum by (queue) (rate(worker_jobs_total[30m])), 0.001) > 0.05
        for: 30m
        labels: { severity: warning }
        annotations: { summary: Job failure ratio above 5% for 30 minutes }
      - alert: SaverSuccessRate
        expr: sum(rate(worker_jobs_total{queue="web-captures",status="completed"}[1h])) / clamp_min(sum(rate(worker_jobs_total{queue="web-captures"}[1h])), 0.001) < 0.95
        for: 1h
        labels: { severity: warning }
        annotations: { summary: Saver capture success below 95% over one hour }
      - alert: ReadinessFailing
        expr: probe_success{job="one-last-note-ready"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: Readiness probe has failed for 2 minutes }

# Backup freshness is monitored by the Render Cron failure notification and BACKUP_ALERT_WEBHOOK_URL.
